<style>
/* Layout: one narrow app column; a lesson path that winds like a forest trail, a norrsken header band, a bottom tab bar */
:root{
  --bg:#F3F7F5; --surface:#FFFFFF; --surface-2:#E7EEEA; --line:#D3DED8;
  --ink:#16251F; --muted:#5A6C64;
  --forest:#2E6B4E; --forest-d:#1E4C36;
  --lingon:#C42B3F; --lingon-d:#8E1B2B;
  --hjorton:#EE9B2F; --hjorton-d:#B56A10;
  --night:#0F1E2C; --night-2:#18324A; --on-night:#EAF6F1; --on-color:#FFFFFF;
  --ok-bg:#DCF2E5; --ok:#1C7548; --bad-bg:#FBE0E3; --bad:#B0223A;
  --locked:#CAD5D0; --locked-d:#A6B3AD; --locked-ink:#7E8C86;
  --sel:#DCEBFA; --sel-line:#5B8DCF;
  --u1:#2E6B4E; --u1d:#1E4C36;
  --u2:#C42B3F; --u2d:#8E1B2B;
  --u3:#23756B; --u3d:#16514A;
  --u4:#3D63A8; --u4d:#28467C;
  --u5:#DA8418; --u5d:#9E5C0B;
  --u6:#8A4FA0; --u6d:#623673;
  --u7:#1F9172; --u7d:#14654F;
  --u8:#8A5A35; --u8d:#5F3C21;
  --u9:#2F7FA0; --u9d:#1F5A73;
  --u10:#B5446E; --u10d:#82304F;
  --u11:#55722F; --u11d:#3A5120;
  --u12:#A0522D; --u12d:#6F381E;
  --u13:#55608F; --u13d:#3B4366;
  --display:"Fredoka","Nunito",ui-rounded,system-ui,sans-serif;
  --body:"Nunito",ui-rounded,system-ui,-apple-system,"Segoe UI",sans-serif;
  --r:16px;
}
@media (prefers-color-scheme: dark){:root:not([data-theme="light"]){
  --bg:#0D1A20; --surface:#14252D; --surface-2:#1B2F38; --line:#2A404A;
  --ink:#E6EFEB; --muted:#9BB0A7;
  --forest:#4FA57A; --forest-d:#2C7451;
  --lingon:#E04E5E; --lingon-d:#9C2A38;
  --hjorton:#F2AC4A; --hjorton-d:#B47719;
  --ok-bg:#163828; --ok:#71D9A1; --bad-bg:#3B1B21; --bad:#FF8E9B;
  --locked:#2B3D45; --locked-d:#1C2B31; --locked-ink:#7D918A;
  --sel:#1C3550; --sel-line:#6E9FE0;
  color-scheme:dark;
}}
:root[data-theme="dark"]{
  --bg:#0D1A20; --surface:#14252D; --surface-2:#1B2F38; --line:#2A404A;
  --ink:#E6EFEB; --muted:#9BB0A7;
  --forest:#4FA57A; --forest-d:#2C7451;
  --lingon:#E04E5E; --lingon-d:#9C2A38;
  --hjorton:#F2AC4A; --hjorton-d:#B47719;
  --ok-bg:#163828; --ok:#71D9A1; --bad-bg:#3B1B21; --bad:#FF8E9B;
  --locked:#2B3D45; --locked-d:#1C2B31; --locked-ink:#7D918A;
  --sel:#1C3550; --sel-line:#6E9FE0;
  color-scheme:dark;
}
*{box-sizing:border-box}
html,body{height:100%}
body{background:var(--bg);color:var(--ink);font-family:var(--body);font-size:16px;line-height:1.5;-webkit-tap-highlight-color:transparent}
button{font:inherit;color:inherit;cursor:pointer;touch-action:manipulation}
.sr{position:absolute;width:1px;height:1px;margin:-1px;padding:0;overflow:hidden;clip:rect(0 0 0 0);white-space:nowrap;border:0}
button:focus-visible,a:focus-visible,input:focus-visible{outline:3px solid var(--sel-line);outline-offset:2px}
h1,h2,h3{font-family:var(--display);text-wrap:balance;margin:0;line-height:1.15}
a{color:var(--forest)}
.wrap{max-width:560px;margin:0 auto;padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px));padding-block:0 120px}
.ic{width:24px;height:24px;flex:none}

/* top stats */
.top{position:sticky;top:env(safe-area-inset-top,0px);z-index:20;background:var(--bg);border-bottom:2px solid var(--line)}
body::before{content:"";position:fixed;inset:0 0 auto;height:env(safe-area-inset-top,0px);z-index:30;background:var(--bg)}
.top-in{max-width:560px;margin:0 auto;padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px));padding-block:10px;display:flex;align-items:center;gap:8px}
.brand{font-family:var(--display);font-weight:700;font-size:22px;color:var(--hjorton-d);display:flex;align-items:center;gap:6px;margin-right:auto}
:root[data-theme="dark"] .brand{color:var(--hjorton)}
@media (prefers-color-scheme: dark){:root:not([data-theme="light"]) .brand{color:var(--hjorton)}}
.stat{display:flex;align-items:center;gap:4px;font-weight:800;font-variant-numeric:tabular-nums;padding:4px 8px;border-radius:10px;background:none;border:0}
.stat:hover{background:var(--surface-2)}
.stat.streak{color:var(--hjorton-d)} .stat.hj{color:var(--hjorton-d)} .stat.li{color:var(--lingon)}
.stat.off{color:var(--locked-ink)}
.stat.acct{color:var(--muted);position:relative}
.stat.acct.on{color:var(--forest)}
.stat.acct.on::after{content:"";position:absolute;right:5px;top:5px;width:8px;height:8px;border-radius:50%;background:var(--forest);border:2px solid var(--bg)}
.nudge{display:flex;align-items:center;gap:10px;flex-wrap:wrap;margin-top:20px;padding:12px 14px;border:2px dashed var(--line);border-radius:14px;color:var(--muted);font-size:14px}
.nudge b{color:var(--ink)}
.nudge .sp{flex:1 1 180px;min-width:0}
.linkish{border:0;background:none;padding:0;color:var(--forest);font-weight:800;text-decoration:underline;text-underline-offset:3px}
.login{display:grid;gap:10px;margin-top:12px}
.login label{font-weight:700;font-size:14px}
.login input,.codebox{width:100%;padding:12px 14px;border-radius:12px;border:2px solid var(--line);background:var(--surface);color:var(--ink);font:inherit;font-size:16px}
.codebox{font-size:13px;font-family:ui-monospace,Menlo,monospace;min-height:80px;resize:vertical}
.fine{font-size:13px;color:var(--muted);margin-top:12px}

/* norrsken hero */
.hero{position:relative;overflow:hidden;border-radius:22px;background:linear-gradient(180deg,var(--night) 0%,var(--night-2) 100%);color:var(--on-night);margin-top:16px;padding:20px 20px 18px;display:flex;gap:14px;align-items:center;min-height:150px}
.hero canvas{position:absolute;inset:0;width:100%;height:100%}
.hero > *:not(canvas){position:relative}
.hero .mascot{width:96px;flex:none}
.hero h1{font-size:24px;font-weight:600}
.hero p{margin:4px 0 10px;opacity:.85;font-size:15px}
.goal{display:flex;align-items:center;gap:10px;font-size:13px;font-weight:700}
.goal .bar{flex:1;height:12px;border-radius:99px;background:rgba(255,255,255,.18);overflow:hidden}
.goal .bar i{display:block;height:100%;background:var(--hjorton);border-radius:99px;transition:width .5s}
.hero-actions{display:flex;gap:8px;margin-top:12px;flex-wrap:wrap}
.chip{border:0;border-radius:12px;padding:7px 12px;font-weight:800;font-size:13px;letter-spacing:.04em;text-transform:uppercase;background:rgba(255,255,255,.14);color:var(--on-night)}
.chip:hover{background:rgba(255,255,255,.24)}

/* unit + path */
.unit{margin-top:28px}
.unit-head{border-radius:var(--r);padding:16px 18px;color:var(--on-color);display:flex;align-items:center;gap:12px;box-shadow:0 4px 0 var(--ud)}
.unit-head .t{flex:1;min-width:0}
.unit-head small{display:block;font-weight:800;letter-spacing:.08em;text-transform:uppercase;font-size:12px;opacity:.85}
.unit-head h2{font-size:22px;font-weight:600}
.unit-head p{margin:2px 0 0;font-size:14px;opacity:.92}
.guide-btn{border:2px solid rgba(255,255,255,.45);background:rgba(255,255,255,.12);border-radius:12px;padding:8px 10px;color:var(--on-color);display:flex;align-items:center;gap:6px;font-weight:800;font-size:13px;flex:none}
.guide-btn:hover{background:rgba(255,255,255,.22)}
.path{position:relative;overflow-x:clip;overflow-y:visible;display:flex;flex-direction:column;align-items:center;gap:22px;padding:28px 0 6px}
.node-wrap{position:relative;display:flex;flex-direction:column;align-items:center}
.node{width:74px;height:70px;border-radius:50%;border:0;background:var(--uc);box-shadow:0 7px 0 var(--ud);display:grid;place-items:center;color:var(--on-color);transition:transform .08s,box-shadow .08s}
.node:active{transform:translateY(5px);box-shadow:0 2px 0 var(--ud)}
.node .ic{width:34px;height:34px}
.node.locked{background:var(--locked);box-shadow:0 7px 0 var(--locked-d);color:var(--locked-ink)}
.node.current{outline:6px solid var(--line);outline:6px solid color-mix(in srgb,var(--uc) 28%,transparent);outline-offset:6px}
.bubble{position:absolute;bottom:calc(100% + 14px);background:var(--surface);border:2px solid var(--line);color:var(--uc);font-weight:800;letter-spacing:.06em;font-size:14px;padding:6px 12px;border-radius:12px;white-space:nowrap;animation:bob 1.6s ease-in-out infinite}
.bubble::after{content:"";position:absolute;left:50%;top:100%;width:12px;height:12px;background:var(--surface);border-right:2px solid var(--line);border-bottom:2px solid var(--line);transform:translate(-50%,-6px) rotate(45deg)}
@keyframes bob{50%{transform:translateY(-4px)}}
.pop{position:absolute;top:calc(100% + 16px);left:50%;transform:translateX(-50%);z-index:15;width:240px;max-width:calc(100vw - 40px);background:var(--uc);color:var(--on-color);border-radius:var(--r);padding:16px;box-shadow:0 10px 30px rgba(0,0,0,.18)}
.pop.locked{background:var(--surface);color:var(--muted);border:2px solid var(--line)}
.pop h3{font-size:18px;font-weight:600}
.pop p{margin:4px 0 12px;font-size:14px;opacity:.92}
.pop .go{width:100%;border:0;border-radius:12px;padding:12px;background:var(--surface);color:var(--uc);font-weight:800;letter-spacing:.06em;text-transform:uppercase;box-shadow:0 4px 0 rgba(0,0,0,.18)}
.trail{position:absolute;left:0;top:0;width:100%;height:100%;pointer-events:none;z-index:0;overflow:visible}
.trail path{fill:none;stroke-linecap:round;stroke-linejoin:round}
.trail-label{position:absolute;left:0;top:6px;font-size:11px;font-weight:800;letter-spacing:.08em;text-transform:uppercase;color:var(--muted);opacity:.8}
.deco{position:absolute;width:76px;height:76px;pointer-events:none;opacity:.95}

/* bottom nav */
.nav{position:fixed;left:0;right:0;bottom:0;z-index:40;background:var(--surface);border-top:2px solid var(--line);padding-bottom:env(safe-area-inset-bottom,0px)}
.nav-in{max-width:560px;margin:0 auto;display:grid;grid-template-columns:repeat(4,1fr);padding-left:max(8px,env(safe-area-inset-left,0px));padding-right:max(8px,env(safe-area-inset-right,0px))}
.nav button{border:0;background:none;padding:8px 4px 10px;display:flex;flex-direction:column;align-items:center;gap:2px;font-size:12px;font-weight:800;color:var(--muted);letter-spacing:.03em;border-radius:12px;margin:4px 2px}
.nav button[aria-current="page"]{color:var(--forest);background:var(--surface-2)}
.nav .ic{width:26px;height:26px}

/* generic page sections */
.page-h{margin-top:22px}
.page-h h1{font-size:28px;font-weight:600}
.page-h p{margin:4px 0 0;color:var(--muted)}
.card{background:var(--surface);border:2px solid var(--line);border-radius:var(--r);padding:16px 18px}
.stack{display:flex;flex-direction:column;gap:14px;margin-top:18px}
.prose{max-width:62ch}
.prose p{margin:8px 0}
.prose h2{font-size:20px;font-weight:600;margin-top:4px}
.ex{font-weight:800;color:var(--forest)}
.src{display:flex;flex-wrap:wrap;gap:8px;margin-top:10px}
.linkbtn{display:inline-flex;align-items:center;gap:6px;text-decoration:none;font-weight:800;font-size:14px;padding:9px 13px;border-radius:12px;border:2px solid var(--line);color:var(--ink);background:var(--surface);box-shadow:0 3px 0 var(--line)}
.linkbtn:hover{background:var(--surface-2)}
.linkbtn .ic{width:18px;height:18px}

/* dictionary */
.search{width:100%;margin-top:16px;padding:13px 16px;border-radius:14px;border:2px solid var(--line);background:var(--surface);color:var(--ink);font:inherit;font-size:16px}
.filters{display:flex;gap:6px;flex-wrap:wrap;margin-top:10px}
.filters button{border:2px solid var(--line);background:var(--surface);border-radius:99px;padding:5px 12px;font-weight:700;font-size:13px}
.filters button[aria-pressed="true"]{background:var(--forest);border-color:var(--forest);color:var(--on-color)}
.dict{margin-top:14px;border:2px solid var(--line);border-radius:var(--r);background:var(--surface);overflow:hidden}
.drow{display:grid;grid-template-columns:minmax(0,1fr) minmax(0,1fr);gap:12px;padding:11px 16px;border-top:1px solid var(--line);align-items:baseline}
.drow:first-child{border-top:0}
.drow b{font-weight:800}
.drow span{color:var(--muted)}
.drow em{grid-column:1/-1;font-style:normal;font-size:13px;color:var(--muted);margin-top:-6px}
.dot{display:inline-block;width:8px;height:8px;border-radius:50%;background:var(--forest);margin-left:6px;vertical-align:middle}
.empty{padding:24px 16px;color:var(--muted);text-align:center}
.dhead{padding:6px 16px;background:var(--surface-2);font-family:var(--display);font-weight:700;font-size:18px;color:var(--forest);border-top:1px solid var(--line);scroll-margin-top:calc(70px + env(safe-area-inset-top,0px))}
.dhead:first-child{border-top:0}
.letters{display:flex;flex-wrap:wrap;gap:4px;margin-top:10px}
.letters:empty{display:none}
.letters button{min-width:32px;height:32px;border:2px solid var(--line);background:var(--surface);border-radius:8px;font-weight:800;font-size:14px;color:var(--forest)}
.letters button:hover{background:var(--surface-2)}
.rank{font-size:13px;font-weight:700;color:var(--hjorton-d);white-space:nowrap}

/* music */
.artist{display:grid;grid-template-columns:56px minmax(0,1fr);gap:14px;align-items:start}
.avatar{width:56px;height:56px;border-radius:16px;display:grid;place-items:center;color:var(--on-color);font-family:var(--display);font-weight:700;font-size:22px}
.artist h2{font-size:20px;font-weight:600}
.artist .tag{font-size:12px;font-weight:800;letter-spacing:.08em;text-transform:uppercase;color:var(--muted)}
.artist p{margin:6px 0 0}

/* lesson overlay */
.lesson{position:fixed;inset:0;z-index:60;background:var(--bg);display:flex;flex-direction:column;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}
.l-top{max-width:640px;width:100%;margin:0 auto;display:flex;align-items:center;gap:14px;padding:14px max(16px,env(safe-area-inset-right,0px)) 6px max(16px,env(safe-area-inset-left,0px))}
.x{border:0;background:none;color:var(--locked-ink);padding:4px;border-radius:8px}
.x:hover{color:var(--ink)}
.prog{flex:1;height:16px;background:var(--surface-2);border-radius:99px;overflow:hidden}
.prog i{display:block;height:100%;width:0;background:var(--forest);border-radius:99px;transition:width .35s;box-shadow:inset 0 -4px 0 rgba(0,0,0,.12)}
.l-body{flex:1;overflow-y:auto;max-width:640px;width:100%;margin:0 auto;padding:12px max(16px,env(safe-area-inset-right,0px)) 24px max(16px,env(safe-area-inset-left,0px))}
.l-kicker{font-size:13px;font-weight:800;letter-spacing:.08em;text-transform:uppercase;color:var(--u6);display:flex;align-items:center;gap:6px;min-height:20px}
.l-q{font-size:24px;font-weight:600;margin:6px 0 18px}
.prompt{display:flex;align-items:flex-end;gap:12px;margin-bottom:22px}
.prompt .mascot{width:86px;flex:none}
.say{position:relative;background:var(--surface);border:2px solid var(--line);border-radius:16px;padding:12px 16px;font-size:20px;font-weight:800;margin-bottom:18px;min-width:0}
.say::before{content:"";position:absolute;left:-9px;bottom:16px;width:14px;height:14px;background:var(--surface);border-left:2px solid var(--line);border-bottom:2px solid var(--line);transform:rotate(45deg)}
.opts{display:grid;gap:10px}
.opt{display:flex;align-items:center;gap:12px;text-align:left;padding:14px 16px;border-radius:14px;border:2px solid var(--line);background:var(--surface);box-shadow:0 4px 0 var(--line);font-weight:700;font-size:17px;min-width:0}
.opt kbd{flex:none;width:26px;height:26px;border:2px solid var(--line);border-radius:8px;display:grid;place-items:center;font:800 13px var(--body);color:var(--muted)}
.opt:hover{background:var(--surface-2)}
.opt[aria-pressed="true"]{background:var(--sel);border-color:var(--sel-line);box-shadow:0 4px 0 var(--sel-line)}
.opt.okk{background:var(--ok-bg);border-color:var(--ok);box-shadow:0 4px 0 var(--ok);color:var(--ok)}
.opt.badd{background:var(--bad-bg);border-color:var(--bad);box-shadow:0 4px 0 var(--bad);color:var(--bad);animation:shake .3s}
.opt.gone{opacity:.35;pointer-events:none;box-shadow:none}
@keyframes shake{25%{transform:translateX(-5px)}75%{transform:translateX(5px)}}
.match{display:grid;grid-template-columns:1fr 1fr;gap:10px}
.match .col{display:grid;gap:10px;align-content:start}
.match .opt{justify-content:center;text-align:center;font-size:16px;padding:14px 10px}
.answer{min-height:112px;border-top:2px solid var(--line);border-bottom:2px solid var(--line);padding:10px 0;display:flex;flex-wrap:wrap;gap:8px;align-content:flex-start;background:repeating-linear-gradient(180deg,transparent 0 50px,var(--line) 50px 52px)}
.bank{display:flex;flex-wrap:wrap;gap:8px;justify-content:center;margin-top:22px}
.tile{border:2px solid var(--line);background:var(--surface);border-radius:12px;padding:8px 13px;font-weight:700;font-size:17px;box-shadow:0 4px 0 var(--line)}
.tile:hover{background:var(--surface-2)}
.tile.ghost{background:var(--surface-2);color:transparent;box-shadow:none;pointer-events:none}
.l-foot{border-top:2px solid var(--line);background:var(--bg)}
.l-foot.ok{background:var(--ok-bg);border-color:transparent}
.l-foot.bad{background:var(--bad-bg);border-color:transparent}
.l-foot-in{max-width:640px;margin:0 auto;padding:16px max(16px,env(safe-area-inset-right,0px)) 18px max(16px,env(safe-area-inset-left,0px));display:flex;gap:14px;align-items:center;flex-wrap:wrap}
.fb{flex:1 1 260px;min-width:0}
.fb h3{font-size:22px;font-weight:600}
.l-foot.ok .fb{color:var(--ok)} .l-foot.bad .fb{color:var(--bad)}
.fb p{margin:2px 0 0;font-weight:700}
.big{border:0;border-radius:14px;padding:14px 22px;min-width:160px;flex:1 1 160px;max-width:100%;font-weight:800;letter-spacing:.08em;text-transform:uppercase;background:var(--forest);color:var(--on-color);box-shadow:0 5px 0 var(--forest-d)}
.big:active{transform:translateY(3px);box-shadow:0 2px 0 var(--forest-d)}
.big:disabled{background:var(--locked);color:var(--locked-ink);box-shadow:0 5px 0 var(--locked-d);cursor:default}
.big.red{background:var(--lingon);box-shadow:0 5px 0 var(--lingon-d)}
.big.ghostb{background:var(--surface);color:var(--muted);border:2px solid var(--line);box-shadow:0 5px 0 var(--line)}
.l-foot .fb:empty{display:none}
.l-foot.idle .big{flex:0 1 220px;margin-left:auto}

/* done screen */
.done{display:flex;flex-direction:column;align-items:center;text-align:center;gap:10px;padding-top:24px}
.done .mascot{width:150px;animation:hop .9s ease-in-out 2}
@keyframes hop{40%{transform:translateY(-18px) rotate(-4deg)}}
.done h1{font-size:32px;font-weight:700;color:var(--hjorton-d)}
.tiles{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:10px;width:100%;max-width:420px;margin-top:10px}
.st{border-radius:14px;border:2px solid var(--tc);overflow:hidden}
.st small{display:block;background:var(--tc);color:var(--on-color);font-weight:800;font-size:11px;letter-spacing:.08em;text-transform:uppercase;padding:4px}
.st b{display:flex;align-items:center;justify-content:center;gap:4px;padding:10px 4px;font-size:22px;font-family:var(--display);font-variant-numeric:tabular-nums;color:var(--tc)}
.st .ic{width:20px;height:20px}

/* modal */
.modal{position:fixed;inset:0;z-index:80;background:rgba(10,20,25,.55);display:grid;place-items:center;padding:16px}
.sheet{background:var(--surface);border-radius:20px;padding:22px;max-width:420px;width:100%;max-height:85vh;overflow-y:auto}
.sheet h2{font-size:22px;font-weight:600}
.sheet ul{padding-left:20px;margin:10px 0}
.sheet li{margin:8px 0}
.sheet .row{display:flex;gap:10px;flex-wrap:wrap;margin-top:16px}
.toast{position:fixed;left:50%;bottom:calc(90px + env(safe-area-inset-bottom,0px));transform:translateX(-50%);background:var(--ink);color:var(--bg);padding:10px 16px;border-radius:12px;font-weight:700;z-index:90;max-width:calc(100% - 32px)}

@media (prefers-reduced-motion: reduce){*{animation:none!important;transition:none!important}}
@media (max-width:420px){.hero .mascot{width:76px}.hero h1{font-size:21px}.l-q{font-size:21px}.deco{display:none}}
</style>

const KEY = "snattren-v1";
const DEF = {xp:0, hj:20, lingon:5, lingonAt:Date.now(), streak:0, lastDay:null, done:{}, seen:{}, miss:{}, count:{}, day:{d:null, xp:0}, sound:true};
let S = Object.assign({}, DEF);
try { const raw = localStorage.getItem(KEY); if (raw) S = Object.assign({}, DEF, JSON.parse(raw)); } catch(e) {}
// Äldre versioner sparade lektioner som "delindex-lektion"; flytta dem till del-id.
const OLD_IDS = ["u1","u2","u3","u4","u5","u6","u7","u8","u9","u10"];
for (const k of Object.keys(S.done)){ const m = k.match(/^(\d+)-(\d)$/); if (m){ if (OLD_IDS[m[1]]) S.done[OLD_IDS[m[1]]+"-"+m[2]] = true; delete S.done[k]; } }
if (!S.count) S.count = {};
function saveLocal(){ try { localStorage.setItem(KEY, JSON.stringify(S)); } catch(e) {} }
function save(){ saveLocal(); if (typeof queueSync === "function") queueSync(); }
const MAXL = 5, REGEN = 30*60*1000, GOAL = 30;
function today(off=0){ const d = new Date(Date.now()+off*864e5); return d.getFullYear()+"-"+String(d.getMonth()+1).padStart(2,"0")+"-"+String(d.getDate()).padStart(2,"0"); }
function regen(){
  if (S.lingon >= MAXL){ S.lingonAt = Date.now(); return; }
  const n = Math.floor((Date.now()-S.lingonAt)/REGEN);
  if (n > 0){ S.lingon = Math.min(MAXL, S.lingon+n); S.lingonAt += n*REGEN; if (S.lingon>=MAXL) S.lingonAt = Date.now(); }
}
function streakAlive(){ return S.lastDay===today() || S.lastDay===today(-1); }
function dayXp(){ return S.day.d===today() ? S.day.xp : 0; }

  $("#s-acct").setAttribute("aria-label", u ? "Ditt konto, inloggad" : "Spara dina framsteg");

function mergeState(a, b){
  const m = Object.assign({}, DEF, a);
  for (const k of ["xp","hj"]) m[k] = Math.max(a[k]||0, b[k]||0);
  for (const k of ["done","seen"]) m[k] = Object.assign({}, b[k]||{}, a[k]||{});
  for (const k of ["count","miss"]){ m[k] = Object.assign({}, b[k]||{}); for (const [w,n] of Object.entries(a[k]||{})) m[k][w] = Math.max(n, m[k][w]||0); }
  if ((b.lastDay||"") > (a.lastDay||"")){ m.lastDay = b.lastDay; m.streak = b.streak; }
  else if (b.lastDay === a.lastDay) m.streak = Math.max(a.streak||0, b.streak||0);
  if (b.day && b.day.d === today() && (!a.day || a.day.d !== today() || b.day.xp > a.day.xp)) m.day = b.day;
  return m;
}
async function pullRemote(){
  try {
    const { data, error } = await sb.from("progress").select("data").eq("user_id", user.id).maybeSingle();
    if (error) throw error;
    if (data && data.data){ S = mergeState(S, data.data); saveLocal(); }
    await pushRemote();
  } catch(e){ toast("Kunde inte hämta dina sparade framsteg just nu. Försök igen senare."); }
}

const shuffle = a => { a = a.slice(); for (let i=a.length-1;i>0;i--){ const j=Math.floor(Math.random()*(i+1)); [a[i],a[j]]=[a[j],a[i]]; } return a; };
const pick = (a,n) => shuffle(a).slice(0,n);
const isPhrase = w => w[0].trim().includes(" ") && w[1].trim().includes(" ");
const norm = s => s.toLowerCase().replace(/[?!.,]/g,"").replace(/\s+/g," ").trim();
const tok = s => s.replace(/[?!.,]/g,"").split(/\s+/).filter(Boolean);
const ALL = UNITS.flatMap((u,ui) => u.words.map(w => ({p:w[0], s:w[1], note:w[2]||"", u:ui, ph:isPhrase(w)})));
function toast(msg){ const t = document.createElement("div"); t.className="toast"; t.textContent=msg; document.body.appendChild(t); setTimeout(()=>t.remove(), 2200); }

let actx = null;
function tone(freqs, dur=.11){
  if (!S.sound) return;
  try {
    actx = actx || new (window.AudioContext||window.webkitAudioContext)();
    const t0 = actx.currentTime;
    freqs.forEach((f,i) => { const o=actx.createOscillator(), g=actx.createGain(); o.type="triangle"; o.frequency.value=f;
      const s=t0+i*dur; g.gain.setValueAtTime(.0001,s); g.gain.exponentialRampToValueAtTime(.18,s+.015); g.gain.exponentialRampToValueAtTime(.0001,s+dur+.06);
      o.connect(g).connect(actx.destination); o.start(s); o.stop(s+dur+.08); });
  } catch(e) {}
}

/* ---------- Lektionsstruktur ---------- */
function lessonPools(ui){
  const ws = ALL.filter(w => w.u===ui);
  const words = ws.filter(w=>!w.ph), phr = ws.filter(w=>w.ph);
  const k = Math.ceil(words.length/2);
  return [
    words.slice(0,k),
    words.slice(k).concat(words.slice(0,2)),
    phr.length ? phr.concat(pick(words,4)) : pick(words, 8),
    ws
  ];
}
const ORDER = UNITS.flatMap((u,ui) => [0,1,2,3].map(li => ui+"-"+li));
const dk = id => { const [ui, li] = id.split("-"); return UNITS[ui].id+"-"+li; };
function currentId(){ return ORDER.find(id => !S.done[dk(id)]) || null; }
function unlocked(id){ const c = currentId(); return c===null || ORDER.indexOf(id) <= ORDER.indexOf(c); }

/* ---------- Övningsgenerering ---------- */
function distract(w, field, n){
  const same = ALL.filter(x => x!==w && x.ph===w.ph && x[field]!==w[field]);
  const near = same.filter(x => x.u===w.u);
  const pool = shuffle(near).concat(shuffle(same.filter(x=>x.u!==w.u)));
  const out = [], seen = new Set([norm(w[field])]);
  for (const x of pool){ const k=norm(x[field]); if (!seen.has(k)){ seen.add(k); out.push(x[field]); } if (out.length>=n) break; }
  return out;
}
function mkMC(w, dir){
  const ans = dir==="ps" ? w.s : w.p;
  return {t:"mc", dir, w, ans, opts: shuffle([ans, ...distract(w, dir==="ps"?"s":"p", 3)]), isNew: !S.seen[w.p]};
}
function mkBuild(w){
  const dir = Math.random()<.5 ? "ps" : "sp";
  const target = dir==="ps" ? w.s : w.p, field = dir==="ps" ? "s" : "p";
  const ans = tok(target);
  const have = new Set(ans.map(norm));
  const extra = shuffle(ALL.filter(x=>x!==w).flatMap(x=>tok(x[field]))).filter(t=>{ const k=norm(t); if(have.has(k)) return false; have.add(k); return true; }).slice(0, Math.max(3, 6-ans.length));
  return {t:"build", dir, w, ans, tiles: shuffle(ans.concat(extra)).map((t,i)=>({t,i}))};
}
function mkMatch(pool){
  const seen = new Set(), pairs = [];
  for (const w of shuffle(pool.filter(x=>!x.ph).length>=4 ? pool.filter(x=>!x.ph) : pool)){
    const a=norm(w.p), b=norm(w.s); if (seen.has(a)||seen.has(b)) continue; seen.add(a); seen.add(b); pairs.push(w); if (pairs.length>=5) break;
  }
  return {t:"match", pairs};
}
function buildLesson(pool, len=11){
  const words = pool.filter(w=>!w.ph), phr = pool.filter(w=>w.ph);
  const fresh = words.filter(w=>!S.seen[w.p]).slice(0,4);
  const ex = fresh.map(w => mkMC(w,"ps"));
  const rest = [];
  pick(phr, Math.min(3, phr.length)).forEach(w => rest.push(mkBuild(w)));
  if (pool.length >= 4) rest.push(mkMatch(pool));
  let i = 0; const src = shuffle(words.length ? words : pool);
  while (ex.length + rest.length < len && src.length){ const w = src[i++ % src.length]; rest.push(mkMC(w, Math.random()<.5?"ps":"sp")); if (i > 40) break; }
  return ex.concat(shuffle(rest));
}

const trailType = ui => ui < 4 ? "stig" : ui < 9 ? "skidspår" : "skoterspår";
function trailSeg(d, type, col){
  if (type==="stig") return `<path d="${d}" style="stroke:${col}" stroke-width="5" stroke-dasharray="0.1 11" opacity=".75"/>`;
  if (type==="skidspår") return `<path d="${d}" style="stroke:${col}" stroke-width="11" opacity=".55"/><path d="${d}" style="stroke:var(--bg)" stroke-width="6"/>`;
  return `<path d="${d}" style="stroke:${col}" stroke-width="20" opacity=".16"/><path d="${d}" style="stroke:${col}" stroke-width="20" stroke-dasharray="3 6" stroke-linecap="butt" opacity=".32"/>`;
}
function drawTrails(){
  document.querySelectorAll(".path").forEach((path, ui) => {
    path.querySelectorAll(".trail, .trail-label").forEach(e => e.remove());
    const pr = path.getBoundingClientRect();
    const nodes = [...path.querySelectorAll(".node")];
    if (!nodes.length) return;
    const pts = nodes.map(n => { const r = n.getBoundingClientRect(); return [r.left + r.width/2 - pr.left, r.top + r.height/2 - pr.top]; });
    pts.unshift([pr.width/2, 0]);
    const type = trailType(ui);
    let svg = "";
    for (let i = 1; i < pts.length; i++){
      const [x0,y0] = pts[i-1], [x1,y1] = pts[i], dy = (y1-y0)/2;
      const d = `M${x0.toFixed(1)} ${y0.toFixed(1)} C${x0.toFixed(1)} ${(y0+dy).toFixed(1)} ${x1.toFixed(1)} ${(y1-dy).toFixed(1)} ${x1.toFixed(1)} ${y1.toFixed(1)}`;
      const reached = i === 1 ? unlocked(ui+"-0") : !!S.done[dk(ui+"-"+(i-2))];
      svg += trailSeg(d, type, reached ? "var(--uc)" : "var(--locked-d)");
    }
    path.insertAdjacentHTML("afterbegin", `<svg class="trail" aria-hidden="true">${svg}</svg><span class="trail-label">${type}</span>`);
  });
}

const sortKey = w => w.p.replace(/^[^A-Za-zÅÄÖåäöÉéÈèÙùÒòÀàÁá]+/, "").normalize("NFC");
const firstLetter = w => { const c = sortKey(w).charAt(0).toLocaleUpperCase("sv"); return ({"É":"E","È":"E","Ù":"U","Ò":"O","À":"A","Á":"A"})[c] || c; };
function drow(w, extra=""){
  return `<div class="drow"><b>${esc(w.p)}${S.seen[w.p]?'<span class="dot" title="Inlärt"></span>':""}</b><span>${esc(w.s)}${extra}</span>${w.note?`<em>${esc(w.note)}</em>`:""}</div>`;
}
function fillDict(){
  const q = norm(dictQ);
  let rows = ALL.filter(w => (dictFilter<0 || w.u===dictFilter) && (!q || norm(w.p).includes(q) || norm(w.s).includes(q)));
  const box = $("#dict"), lb = $("#letters");
  lb.innerHTML = "";
  if (!rows.length){ box.innerHTML = `<div class="empty">Inga träffar på "${esc(dictQ)}". Prova ett kortare ord.</div>`; return; }
  if (dictSort==="az"){
    rows = rows.slice().sort((a,b)=>sortKey(a).localeCompare(sortKey(b),"sv",{sensitivity:"base"}));
    let html = "", cur = "";
    const letters = [];
    rows.forEach(w => { const L = firstLetter(w); if (L!==cur){ cur=L; letters.push(L); html += `<div class="dhead" data-letter="${esc(L)}">${esc(L)}</div>`; } html += drow(w); });
    box.innerHTML = html;
    lb.innerHTML = letters.map(L=>`<button data-jump="${esc(L)}">${esc(L)}</button>`).join("");
  } else if (dictSort==="top" || dictSort==="hard"){
    const src = dictSort==="top" ? S.count : S.miss;
    const ranked = rows.filter(w => src[w.p]>0).sort((a,b)=>src[b.p]-src[a.p]).slice(0,50);

  } else {
    box.innerHTML = rows.map(w=>drow(w)).join("");
  }
}

let auroraRaf = 0;
function startAurora(){
  cancelAnimationFrame(auroraRaf);
  const cv = $("#aurora"); if (!cv) return;
  const ctx = cv.getContext("2d");
  const reduce = matchMedia("(prefers-reduced-motion: reduce)").matches;
  const dpr = Math.min(2, devicePixelRatio||1);
  let W=0,H=0;
  const stars = Array.from({length:40}, ()=>({x:Math.random(), y:Math.random()*.7, r:Math.random()*1.2+.3, p:Math.random()*6}));
  const flakes = Array.from({length:26}, ()=>({x:Math.random(), y:Math.random(), r:Math.random()*1.8+.6, v:Math.random()*.0015+.0006}));
  function size(){ const b=cv.getBoundingClientRect(); W=b.width; H=b.height; cv.width=W*dpr; cv.height=H*dpr; ctx.setTransform(dpr,0,0,dpr,0,0); }
  size();
  let visible = true;
  const io = "IntersectionObserver" in window ? new IntersectionObserver(([e]) => {
    visible = e.isIntersecting;
    if (visible && !reduce){ cancelAnimationFrame(auroraRaf); auroraRaf = requestAnimationFrame(frame); }
  }) : null;
  if (io) io.observe(cv);
  function frame(t){
    if (!cv.isConnected){ if (io) io.disconnect(); return; }
    if (cv.width !== Math.round(cv.getBoundingClientRect().width*dpr)) size();
    ctx.clearRect(0,0,W,H);
    stars.forEach(s=>{ ctx.globalAlpha=.35+.35*Math.sin(t/900+s.p); ctx.fillStyle="#fff"; ctx.beginPath(); ctx.arc(s.x*W,s.y*H,s.r,0,7); ctx.fill(); });
    const bands = [["rgba(80,230,170,", .0, 0.28, 22],["rgba(70,200,210,", 1.7, 0.4, 30],["rgba(150,110,230,", 3.1, 0.18, 26]];
    bands.forEach(([col, ph, base, amp], bi)=>{
      ctx.globalAlpha = 1;
      for (let x=0; x<=W; x+=4){
        const y = H*base + Math.sin(x/90 + t/2600 + ph)*amp + Math.sin(x/37 + t/1700 + ph*2)*amp*.35;
        const hgt = 50 + 30*Math.sin(x/60 + t/2000 + ph);
        const g = ctx.createLinearGradient(0,y-hgt,0,y+10);
        g.addColorStop(0, col+"0)"); g.addColorStop(.75, col+(bi===2?.16:.3)+")"); g.addColorStop(1, col+"0)");
        ctx.fillStyle = g; ctx.fillRect(x, y-hgt, 4, hgt+10);
      }
    });
    ctx.fillStyle="#fff";
    flakes.forEach(f=>{ f.y += reduce?0:f.v; if (f.y>1) f.y=0; ctx.globalAlpha=.7; ctx.beginPath(); ctx.arc(f.x*W + Math.sin(t/1200+f.x*9)*6, f.y*H, f.r, 0, 7); ctx.fill(); });
    ctx.globalAlpha = 1;
    if (!reduce && !document.hidden && visible) auroraRaf = requestAnimationFrame(frame);
  }
  frame(performance.now());
  document.addEventListener("visibilitychange", ()=>{ if (!document.hidden && tab==="learn" && !L){ cancelAnimationFrame(auroraRaf); auroraRaf=requestAnimationFrame(frame);} }, {once:true});
}

let L = null;
function startLesson(id, practice=false){
  regen();
  if (!practice && S.lingon<=0) return noLingon(null);
  let pool, ui = -1, li = -1;
  if (practice){
    const weak = ALL.filter(w => S.miss[w.p]>0);
    const seen = ALL.filter(w => S.seen[w.p]);
    if (seen.length < 4){ toast("Gör en lektion först, sedan kan du öva."); return; }
    pool = shuffle(weak).slice(0,6).concat(pick(seen.filter(w=>!weak.includes(w)), 6));
  } else {
    [ui, li] = id.split("-").map(Number);
    pool = lessonPools(ui)[li];
  }
  const items = buildLesson(pool, li===3 ? 13 : 11);
  L = {id, ui, li, practice, items, pos:0, total:items.length, right:0, wrong:0, firstTry:0, state:null};
  openPop = null;
  cancelAnimationFrame(auroraRaf);
  $("#layer").innerHTML = `<div class="lesson" role="dialog" aria-label="Lektion">
    <div class="l-top"><button class="x" data-act="quit" aria-label="Avsluta lektionen">${ic("i-x")}</button>
      <div class="prog" role="progressbar" aria-valuemin="0" aria-valuemax="100"><i></i></div>
      <span class="stat li ${practice?"off":""}" title="Lingon">${ic("i-lingon")}<span id="l-li">${practice?"∞":S.lingon}</span></span></div>
    <div class="l-body" id="lb"></div>
    <div class="l-foot idle" id="lf"><div class="l-foot-in"><div class="fb" id="fbx"></div><button class="big" id="check" disabled>Kontrollera</button></div></div></div>`;
  document.body.style.overflow = "hidden";
  showItem();
}
function setProg(){ const p = $(".prog"); p.firstElementChild.style.width = (L.right/L.total*100)+"%"; p.setAttribute("aria-valuenow", Math.round(L.right/L.total*100)); }
function footIdle(enabled=false, label="Kontrollera"){
  const f = $("#lf"); f.className = "l-foot idle"; $("#fbx").innerHTML = "";
  const b = $("#check"); b.textContent = label; b.disabled = !enabled; b.className = "big";
}
function showItem(){
  setProg();
  const it = L.items[L.pos];
  L.state = {sel:null, built:[], done:false};
  const lb = $("#lb"); lb.scrollTop = 0;
  footIdle(false);
  if (it.t==="mc"){
    const q = it.dir==="ps" ? "Vad betyder det här?" : "Hur säger man det på pitemål?";
    const shown = it.dir==="ps" ? it.w.p : it.w.s;
    lb.innerHTML = `<div class="l-kicker">${it.isNew ? `${ic("i-star")} Nytt ord` : it.redo ? "Tidigare misstag" : ""}</div>
      <h2 class="l-q">${q}</h2>
      <div class="prompt">${mascot(it.isNew?"wow":"happy")}<div class="say">${esc(shown)}</div></div>
      <div class="opts">${it.opts.map((o,i)=>`<button class="opt" data-opt="${i}" aria-pressed="false"><kbd>${i+1}</kbd><span>${esc(o)}</span></button>`).join("")}</div>`;
  } else if (it.t==="build"){
    const q = it.dir==="ps" ? "Översätt till svenska" : "Översätt till pitemål";
    const shown = it.dir==="ps" ? it.w.p : it.w.s;
    lb.innerHTML = `<div class="l-kicker">${it.redo ? "Tidigare misstag" : ""}</div><h2 class="l-q">${q}</h2>
      <div class="prompt">${mascot()}<div class="say">${esc(shown)}</div></div>
      <div class="answer" id="ans" aria-label="Ditt svar"></div><div class="bank" id="bank"></div>`;
    drawBuild();
  } else if (it.t==="match"){
    const left = shuffle(it.pairs), right = shuffle(it.pairs);
    L.state.matched = 0; L.state.pick = null;
    lb.innerHTML = `<div class="l-kicker"></div><h2 class="l-q">Para ihop orden</h2>
      <div class="match"><div class="col">${left.map(w=>`<button class="opt" data-m="p" data-k="${esc(w.p)}">${esc(w.p)}</button>`).join("")}</div>
      <div class="col">${right.map(w=>`<button class="opt" data-m="s" data-k="${esc(w.p)}">${esc(w.s)}</button>`).join("")}</div></div>`;
  }
}
function drawBuild(){
  const it = L.items[L.pos], st = L.state;
  $("#ans").innerHTML = st.built.map((ti,k)=>`<button class="tile" data-un="${k}">${esc(it.tiles[ti].t)}</button>`).join("");
  $("#bank").innerHTML = it.tiles.map((t,i)=>`<button class="tile ${st.built.includes(i)?"ghost":""}" data-tile="${i}" ${st.built.includes(i)?'tabindex="-1" aria-hidden="true"':""}>${esc(t.t)}</button>`).join("");
  footIdle(st.built.length>0);
}
function check(){
  const it = L.items[L.pos], st = L.state;
  if (st.done) return next();
  let ok = false, correct = "";
  if (it.t==="mc"){
    if (st.sel===null) return;
    ok = it.opts[st.sel] === it.ans; correct = it.ans;
    document.querySelectorAll("[data-opt]").forEach((b,i)=>{ b.disabled=true; if (it.opts[i]===it.ans) b.classList.add("okk"); else if (i===st.sel) b.classList.add("badd"); });
  } else if (it.t==="build"){
    if (!st.built.length) return;
    ok = norm(st.built.map(i=>it.tiles[i].t).join(" ")) === norm(it.ans.join(" "));
    correct = it.dir==="ps" ? it.w.s : it.w.p;
    document.querySelectorAll("#ans .tile, #bank .tile").forEach(b=>b.disabled=true);
  }
  resolve(ok, correct, it);
}
function resolve(ok, correct, it){
  const st = L.state; st.done = true;
  const f = $("#lf"), b = $("#check");
  const words = it.t==="match" ? it.pairs : [it.w];
  if (ok){
    L.right++; if (!it.redo) L.firstTry++;
    words.forEach(w => { S.seen[w.p]=1; S.count[w.p]=(S.count[w.p]||0)+1; if (L.practice && S.miss[w.p]) S.miss[w.p]--; });
    const pr = PRAISE[Math.floor(Math.random()*PRAISE.length)];
    f.className = "l-foot ok";
    $("#fbx").innerHTML = `<h3>${esc(pr[0])}</h3><p>Pitemål för ${esc(pr[1])}.${it.w && it.w.note ? " "+esc(it.w.note)+"." : ""}</p>`;
    b.className = "big"; tone([660, 990]);
  } else {
    L.wrong++;
    S.miss[it.w.p] = (S.miss[it.w.p]||0)+1; S.count[it.w.p] = (S.count[it.w.p]||0)+1;
    const again = Object.assign({}, it, {redo:true});
    if (again.opts) again.opts = shuffle(again.opts);
    if (again.tiles) again.tiles = shuffle(again.tiles.map(x=>x.t)).map((t,i)=>({t,i}));
    L.items.push(again);
    if (!L.practice){ S.lingon = Math.max(0, S.lingon-1); if (S.lingon < MAXL && S.lingonAt > Date.now()-1000) S.lingonAt = Date.now(); $("#l-li").textContent = S.lingon; }
    f.className = "l-foot bad";
    $("#fbx").innerHTML = `<h3>Hä gäll it djööl!</h3><p>${it.t==="match" ? "Du får göra om den här i slutet." : "Rätt svar: "+esc(correct)}</p>`;
    b.className = "big red"; tone([300, 210], .14);
  }
  save(); setProg();
  b.textContent = "Fortsätt"; b.disabled = false; b.focus({preventScroll:true});
}
function next(){
  if (!L.practice && S.lingon<=0 && L.pos < L.items.length-1) return noLingon(L);
  L.pos++;
  if (L.pos >= L.items.length) return finish();
  showItem();
}
function finish(){
  const acc = Math.round(L.firstTry / L.total * 100);
  const base = L.practice ? 5 : S.done[dk(L.id)] ? 5 : (L.li===3 ? 15 : 10);
  const xp = base + (L.wrong===0 ? 5 : 0);
  const hj = L.practice ? 2 : (L.wrong===0 ? 10 : 5);
  S.xp += xp; S.hj += hj;
  if (S.day.d !== today()) S.day = {d:today(), xp:0};
  S.day.xp += xp;
  if (S.lastDay !== today()){ S.streak = S.lastDay===today(-1) ? S.streak+1 : 1; S.lastDay = today(); }
  if (L.practice) S.lingon = Math.min(MAXL, S.lingon+1);
  else S.done[dk(L.id)] = true;
  save(); tone([523,659,784,1047], .1);
  $("#lb").innerHTML = `<div class="done">${mascot("wow")}<h1>${L.wrong===0 ? "Felfritt!" : "Lektionen är klar!"}</h1>
    <p>${L.practice ? "Bra övat. Du fick ett lingon tillbaka." : L.wrong===0 ? "Inte ett enda fel. Slecke sleukt besleut!" : "Hä jär klaart. Fortsätt så."}</p>
    <div class="tiles">
      <div class="st" style="--tc:var(--hjorton-d)"><small>XP</small><b>${ic("i-bolt")}${xp}</b></div>
      <div class="st" style="--tc:var(--forest)"><small>Träffsäkerhet</small><b>${ic("i-target")}${acc}%</b></div>
      <div class="st" style="--tc:var(--lingon)"><small>Hjortron</small><b>${ic("i-hj")}+${hj}</b></div>
    </div>${CAN_LOGIN && !user ? `<p class="fine">Vill du spara framstegen på alla enheter? <button class="linkish" data-act="account">Logga in</button></p>` : ""}</div>`;
  $(".prog i").style.width = "100%";
  const f = $("#lf"); f.className = "l-foot idle"; $("#fbx").innerHTML = "";
  const b = $("#check"); b.textContent = "Fortsätt"; b.disabled = false; b.className = "big";
  L.finished = true;
}
function closeLesson(){
  L = null; $("#layer").innerHTML = ""; document.body.style.overflow = ""; render();
}
function noLingon(lesson){
  const cost = 30, can = S.hj >= cost;
  modal(`<h2>Slut på lingon</h2><p>Du har inga lingon kvar. Ett nytt lingon växer fram var 30:e minut, och du får ett när du gör en övning.</p>
    <div class="row">${can ? `<button class="big" data-act="buy">Fyll på för ${cost} ${"hjortron"}</button>` : ""}
    <button class="big ghostb" data-act="endlesson">${lesson ? "Avsluta lektionen" : "Stäng"}</button></div>`);
}
function modal(inner){
  const m = document.createElement("div"); m.className="modal"; m.innerHTML = `<div class="sheet" role="dialog" aria-modal="true">${inner}</div>`;
  m.addEventListener("click", e => { if (e.target===m) m.remove(); });
  document.body.appendChild(m);
  const f = m.querySelector("button"); if (f) f.focus();
}

/* ---------- Händelser ---------- */
document.addEventListener("click", async e => {
  const t = e.target.closest("button"); if (!t) { if (openPop && !e.target.closest(".pop")){ openPop=null; if(!L) render(); } return; }
  if (t.dataset.tab){ tab = t.dataset.tab; openPop=null; render(); window.scrollTo(0,0); return; }
  if (t.dataset.node){ openPop = openPop===t.dataset.node ? null : t.dataset.node; render(); return; }
  if (t.dataset.start){ startLesson(t.dataset.start); return; }
  if (t.dataset.guide !== undefined){ const u = UNITS[+t.dataset.guide];
    modal(`<h2>${esc(u.title)}</h2><p style="color:var(--muted);margin:2px 0 0">Guide till del ${+t.dataset.guide+1}</p><ul>${u.tips.map(x=>`<li>${x}</li>`).join("")}</ul>
    <div class="row"><button class="big" data-act="closemodal">Uppfattat</button></div>`); return; }
  const a = t.dataset.act;
  if (a==="closemodal"){ t.closest(".modal").remove(); return; }
  if (a==="account"){ if (CAN_LOGIN && sb) accountModal(); else if (CAN_LOGIN) toast("Inloggningen laddar, försök igen om en sekund."); return; }
  if (a==="logout"){ t.closest(".modal").remove(); if (sb) await sb.auth.signOut(); toast("Utloggad. Framstegen finns kvar i den här webbläsaren."); return; }
  if (a==="nudgeoff"){ S.nudgeOff = true; save(); render(); return; }
  if (a==="export"){
    const code = exportCode();
    try { await navigator.clipboard.writeText(code); toast("Koden är kopierad. Klistra in den på den andra enheten."); }
    catch(e){ const ta = $("#import-code"); ta.value = code; ta.focus(); ta.select(); toast("Markera och kopiera koden i rutan."); }
    return;
  }
  if (a==="import"){
    try { const data = importCode($("#import-code").value); S = mergeState(S, data); save(); toast("Framstegen är hämtade."); render(); }
    catch(e){ toast("Koden gick inte att läsa. Kontrollera att hela koden är med, från PITE1: till slutet."); }
    return;
  }
  if (a==="practice"){ startLesson(null, true); return; }
  if (a==="sound"){ S.sound=!S.sound; save(); render(); return; }
  if (a==="reset"){ $("#reset-box .src").innerHTML = `<span style="font-weight:700">All XP och alla lektioner raderas.</span><button class="linkbtn" data-act="reset2" style="color:var(--bad)">Ja, börja om</button><button class="linkbtn" data-act="reset0">Avbryt</button>`; return; }
  if (a==="reset0"){ render(); return; }
  if (a==="reset2"){ S = Object.assign({}, DEF, {lingonAt:Date.now(), done:{}, seen:{}, miss:{}, day:{d:null,xp:0}}); save(); toast("Framstegen är nollställda"); tab="learn"; render(); return; }
  if (a==="buy"){ S.hj -= 30; S.lingon = MAXL; S.lingonAt = Date.now(); save(); t.closest(".modal").remove(); if (L) $("#l-li").textContent = S.lingon; renderStats(); toast("Lingonen är påfyllda"); return; }
  if (a==="endlesson"){ t.closest(".modal").remove(); if (L) closeLesson(); return; }
  if (a==="quit"){ closeLesson(); return; }
  if (t.dataset.sort){ dictSort = t.dataset.sort; document.querySelectorAll("[data-sort]").forEach(b=>b.setAttribute("aria-pressed", b===t)); fillDict(); return; }
  if (t.dataset.jump){ const h = document.querySelector(`.dhead[data-letter="${CSS.escape(t.dataset.jump)}"]`); if (h) h.scrollIntoView({behavior:"smooth", block:"start"}); return; }
  if (t.dataset.f !== undefined){ dictFilter = +t.dataset.f; document.querySelectorAll("[data-f]").forEach(b=>b.setAttribute("aria-pressed", b===t)); fillDict(); return; }
  if (!L) return;
  if (t.id==="check"){ if (L.finished) return closeLesson(); check(); return; }
  if (L.state && L.state.done) return;
  const it = L.items[L.pos];
  if (t.dataset.opt !== undefined){ L.state.sel = +t.dataset.opt; document.querySelectorAll("[data-opt]").forEach(b=>b.setAttribute("aria-pressed", b===t)); footIdle(true); tone([520], .05); return; }
  if (t.dataset.tile !== undefined){ L.state.built.push(+t.dataset.tile); drawBuild(); tone([520], .04); return; }
  if (t.dataset.un !== undefined){ L.state.built.splice(+t.dataset.un, 1); drawBuild(); return; }
  if (t.dataset.m){
    const st = L.state;
    if (!st.pick || st.pick.dataset.m === t.dataset.m){
      document.querySelectorAll("[data-m]").forEach(b=>b.setAttribute("aria-pressed","false"));
      st.pick = t; t.setAttribute("aria-pressed","true"); tone([520], .04); return;
    }
    const a1 = st.pick, ok = a1.dataset.k === t.dataset.k;
    a1.setAttribute("aria-pressed","false"); st.pick = null;
    if (ok){
      [a1,t].forEach(b=>{ b.classList.add("okk"); setTimeout(()=>b.classList.add("gone"), 350); });
      st.matched++; tone([700], .06);
      if (st.matched === it.pairs.length) setTimeout(()=>resolve(!st.missed, "", it), 400);
    } else {
      st.missed = true; [a1,t].forEach(b=>{ b.classList.add("badd"); setTimeout(()=>b.classList.remove("badd"), 450); }); tone([260], .1);
      if (!it.w) it.w = it.pairs.find(w=>w.p===a1.dataset.k || w.p===t.dataset.k);
    }
  }
});
document.addEventListener("keydown", e => {
  if (document.querySelector(".modal")){ if (e.key==="Escape") document.querySelector(".modal").remove(); return; }
  if (!L) return;
  if (e.key==="Enter"){ const b=$("#check"); if (b && !b.disabled){ e.preventDefault(); b.click(); } return; }
  if (e.key==="Escape"){ closeLesson(); return; }
  const n = parseInt(e.key,10);
  if (n>=1 && n<=4){ const o = document.querySelector(`[data-opt="${n-1}"]`); if (o && !o.disabled) o.click(); }
});
setInterval(()=>{ if (!L) renderStats(); }, 60000);
render();
initAuth();
</script>
<script>if ("serviceWorker" in navigator && location.protocol === "https:") addEventListener("load", () => navigator.serviceWorker.register("/sw.js").catch(() => {}));</script>
</body>
</html>
